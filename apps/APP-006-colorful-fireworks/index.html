<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1236">
    <meta name="description" content="タッチすると、やさしい音とカラフルな花火が広がる幼児向けWebアプリです。">
    <title>カラフル花火</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="../../shared/portal-home.css">
  </head>
  <body>
    <main id="app" class="app" tabindex="0" aria-label="花火を出す画面。Enterキーかスペースキーでも遊べます">
      <canvas id="fireworksCanvas" aria-hidden="true"></canvas>

      <div class="stars" aria-hidden="true">
        <span class="star star-1"></span><span class="star star-2"></span>
        <span class="star star-3"></span><span class="star star-4"></span>
        <span class="star star-5"></span><span class="star star-6"></span>
        <span class="star star-7"></span><span class="star star-8"></span>
      </div>

      <header class="top-bar">
        <button class="portal-home-button" type="button" data-portal-home="../../" aria-label="ホームへ戻る（2秒長押し）">
          <span class="portal-home-icon" aria-hidden="true">🏠</span>
        </button>
        <div class="title-area">
          <p class="eyebrow">ゆびで ポン！</p>
          <h1>カラフル花火</h1>
        </div>

        <button
          id="soundButton"
          class="sound-button"
          type="button"
          aria-label="音をオフにする"
          aria-pressed="true"
        >
          <span id="soundIcon" class="sound-icon" aria-hidden="true">🔊</span>
          <span class="sound-label">おと</span>
        </button>
      </header>

      <section id="guide" class="guide" aria-label="遊び方">
        <div class="touch-picture" aria-hidden="true">
          <span class="touch-ring"></span>
          <span class="touch-hand">☝️</span>
        </div>
        <p class="guide-main">すきなところを<br class="small-screen-break"> タッチしてね！</p>
        <p class="guide-sub">きれいな はなびが ひらくよ</p>
      </section>

      <p id="canvasError" class="error-message" role="status" hidden>
        このブラウザでは花火を表示できません。
      </p>
    </main>

    <script src="js/script.js" defer></script>
    <script src="../../shared/portal-home.js" defer></script>
  </body>
</html>
