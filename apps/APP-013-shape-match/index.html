<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f1">
  <title>かたちポン！</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main aria-label="かたちポン！">
    <div id="board" aria-label="形あそび">
      <div id="target-circle" class="target circle" role="img" aria-label="まるの型">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47"/></svg>
      </div>
      <div id="target-square" class="target square" role="img" aria-label="しかくの型">
        <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="3" y="3" width="94" height="94" rx="5"/></svg>
      </div>
      <div id="target-triangle" class="target triangle" role="img" aria-label="さんかくの型">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 3 L97 97 H3 Z"/></svg>
      </div>
      <button id="piece-circle" class="piece circle" type="button" aria-label="まるをまるの型へ" aria-disabled="false">
        <span class="piece-art"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48"/></svg></span>
      </button>
      <button id="piece-square" class="piece square" type="button" aria-label="しかくをしかくの型へ" aria-disabled="false">
        <span class="piece-art"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="2" y="2" width="96" height="96" rx="5"/></svg></span>
      </button>
      <button id="piece-triangle" class="piece triangle" type="button" aria-label="さんかくをさんかくの型へ" aria-disabled="false">
        <span class="piece-art"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 2 L98 98 H2 Z"/></svg></span>
      </button>
    </div>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
