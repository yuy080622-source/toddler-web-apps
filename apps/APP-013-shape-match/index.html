<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f1">
  <title>かたちポン！</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=20261008-animal">
  <script src="app.js?v=20261008-animal" defer></script>
</head>
<body>
  <main aria-label="かたちポン！">
    <div id="board" aria-label="形あそび">
      <div id="target" class="target" role="img" aria-label="かめのまるい甲羅の型">
        <svg viewBox="-100 -65 200 130" aria-hidden="true">

              <path class="animal-part" d="M-46 -4 Q-67 -15 -77 -1 Q-62 9 -46 8 Z"/>

                <circle class="eye" cx="72" cy="-9" r="2.8"/>

              </g>
            </g>
            <circle class="socket" cx="0" cy="0" r="48"/>

            <rect class="socket" x="-48" y="-48" width="96" height="96" rx="10"/>
          </g>
          <g id="animal-fox" class="animal-scene" hidden>
            <g class="animal-surround">
              <path class="animal-part" d="M-20 37 Q-28 60 -10 62 H14 Q33 55 21 34 Z"/>
              <path class="animal-part" d="M17 44 Q61 59 77 32 Q82 13 61 7 Q63 35 17 32 Z"/>

            </g>
            <path class="socket" d="M-48 -46 H48 L0 48 Z"/>
            <g class="animal-details">
              <path class="cream" d="M-43 -28 Q-8 -19 0 35 L-21 4 Z M43 -28 Q8 -19 0 35 L21 4 Z"/>

              <circle class="eye" cx="18" cy="-14" r="3"/>
              <path class="eye" d="M-5 33 Q0 30 5 33 L0 40 Z"/>
            </g>
          </g>
        </svg>
      </div>
      <button id="piece" class="piece" type="button" aria-label="まるをかめの甲羅へ" aria-disabled="false">
        <span class="piece-art">
          <svg viewBox="-50 -50 100 100" aria-hidden="true">
            <circle id="shape-circle" cx="0" cy="0" r="48"/>
            <rect id="shape-square" x="-48" y="-48" width="96" height="96" rx="10" hidden/>
            <path id="shape-triangle" d="M-48 -46 H48 L0 48 Z" hidden/>
          </svg>
        </span>
      </button>
    </div>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
