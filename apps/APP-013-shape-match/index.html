<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

<body>
  <!-- One definition per shape: both the hole and the persistent piece reference it. -->
  <svg class="shape-definitions" aria-hidden="true" width="0" height="0">

      <circle id="form-circle" r="50"/>
      <rect id="form-rectangle" x="-68" y="-42" width="136" height="84" rx="18"/>

  </svg>
  <main aria-label="かたちポン！">

              <path class="face-line" d="M93 -1 Q98 5 104 0"/>

          </g>

            </g>
            <use class="socket" href="#form-egg"/>

          </g>

      </div>
      <div id="features" class="features" aria-hidden="true"><svg viewBox="-120 -78 240 156"><g id="details-turtle" class="animal-details shell-lines">

<g id="details-dog" class="animal-details" hidden></g>

              <circle class="eye" cx="-15" cy="-17" r="3.5"/><circle class="eye" cx="15" cy="-17" r="3.5"/>
              <path class="beak" d="M-8 -6 Q0 -11 8 -6 Q0 6 -8 -6 Z"/>
              <ellipse class="blush" cx="-24" cy="-5" rx="6" ry="4"/><ellipse class="blush" cx="24" cy="-5" rx="6" ry="4"/>

            </g>
<g id="details-fish" class="animal-details" hidden>
              <path class="fin-line" d="M-16 -14 Q-1 0 -16 14 M-30 -11 Q-17 0 -30 11"/>

              <ellipse class="blush" cx="27" cy="6" rx="5" ry="3"/>
            </g></svg></div>
      <button id="piece" class="piece" type="button" aria-label="まるをかめの甲羅へ" aria-disabled="false">
        <span class="piece-art">
          <svg id="piece-svg" viewBox="-52 -52 104 104" aria-hidden="true">
            <use id="shape-circle" href="#form-circle"/>
            <use id="shape-rectangle" href="#form-rectangle" hidden/>
            <use id="shape-egg" href="#form-egg" hidden/>
            <use id="shape-triangle" href="#form-triangle" hidden/>
            <use id="shape-diamond" href="#form-diamond" hidden/>
          </svg>
        </span>
      </button>
    </div>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
